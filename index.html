<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코묻은돈 · 오늘의 코인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">₩</span><span>코묻은돈</span></div>
        <div class="status-pill"><span class="status-dot"></span><span id="statusText">새근새근 꿈나라</span></div>
      </header>

      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">MY TINY PAYDAY</p>
          <h1>지금 이 순간,<br /><span>코인이 얼마나 쌓였을까?</span></h1>
          <p class="subcopy">월급을 알려주면 귀여운 <span id="botNameText">머니봇</span>이<br />일하는 동안 쌓이는 코인을 세어줄게요.</p>
          <button class="primary-button" id="startButton">머니봇 깨우기 <span>✦</span></button>
        </div>
        <div class="robot-stage is-sleeping" aria-label="잠자는 머니봇">
          <div class="coin-reserve" id="coinReserve" role="progressbar" aria-label="오늘의 코인 적립률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="coin-fill" id="coinFill"><div class="coin-pattern"></div></div>
          </div>
          <div class="coin-caption"><strong id="coinPercent">0%</strong><span id="coinCaption">오늘의 코인 · 1시간마다 차곡차곡</span></div>
          <div class="spark spark-one">✦</div><div class="spark spark-two">✧</div><div class="spark spark-three">·</div>
          <div class="speech-bubble" id="speechBubble">새근새근<br /><strong>꿈에서도 차곡차곡…</strong></div>
          <div class="robot-shadow"></div>
          <div class="robot">
            <span class="mood-prop" aria-hidden="true"></span>
            <span class="sleep-marks" aria-hidden="true">Z<span>z</span><small>z</small></span>
            <div class="antenna"><i></i></div>
            <div class="robot-head">
              <div class="ear ear-left"></div><div class="ear ear-right"></div>
              <div class="face-screen"><span class="eye eye-left"></span><span class="eye eye-right"></span><span class="mouth"></span></div>
            </div>
            <div class="robot-body"><div class="chest-light"></div><div class="chest-label">₩</div><div class="arm arm-left"></div><div class="arm arm-right"></div></div>
            <div class="robot-feet"><div></div><div></div></div>
          </div>
        </div>
      </section>

      <section class="dashboard-grid">
        <div class="earnings-card card">
          <div class="card-heading"><div><p class="label">오늘 모은 코인</p><h2 id="earnedToday">₩0</h2></div><span class="coin-icon">₩</span></div>
          <fieldset class="earning-units" aria-label="코인 보기 옵션">
            <label><input type="radio" name="earningUnit" value="second" /><span>초당 보기</span></label>
            <label><input type="radio" name="earningUnit" value="minute" /><span>분당 보기</span></label>
            <label><input type="radio" name="earningUnit" value="hour" checked /><span>시간당 보기</span></label>
          </fieldset>
          <div class="rate-row"><span id="rateLabel">시간당</span><strong id="perMinute">₩0</strong><span class="rate-badge">자동 계산</span></div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p class="tiny-note"><span class="pulse"></span> <span id="elapsedText">아직 시작 전이에요</span></p>
        </div>

        <div class="settings-card card">
          <div class="card-heading"><div><p class="label">내 코인 밥그릇 채우기</p><h3>숫자만 바꿔보세요</h3><p class="privacy-note" id="storageStatus" role="status">입력한 정보는 브라우저에 자동 저장돼요.</p></div><span class="gear">⚙</span></div>
          <div class="input-row"><label for="botName">봇 이름</label><div class="input-wrap"><input id="botName" type="text" maxlength="10" placeholder="예: 까종" autocomplete="off" /><span>봇</span></div></div>
          <div class="input-row"><label for="salary">월급</label><div class="input-wrap"><input id="salary" type="text" inputmode="numeric" value="1,000,000" /><span>원</span></div></div>
          <div class="input-row"><label for="days">한 달 근무일</label><div class="input-wrap"><input id="days" type="number" min="1" max="31" value="20" /><span>일</span></div></div>
          <div class="input-row"><label for="startTime">근무 시작</label><div class="input-wrap"><input id="startTime" type="time" value="09:00" /></div></div>
          <div class="input-row"><label for="endTime">근무 종료</label><div class="input-wrap"><input id="endTime" type="time" value="18:00" /></div></div>
          <button class="secondary-button" id="saveButton">저장할래요 <span>→</span></button>
          <button class="secondary-button" id="resetButton" type="button">초기화 <span>↺</span></button>
        </div>
      </section>

      <footer><span>작은 숫자도 모이면 꽤 뿌듯하니까요</span><span class="footer-heart">♥</span></footer>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
